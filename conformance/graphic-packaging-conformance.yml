note: >-
  Graphic Packaging is a paperboard packaging manufacturer, not a software
  vendor. It publishes no OpenAPI, no OAuth surface and no API-protocol
  conformance claims, so the API-side conformance list is empty rather than
  invented. What it does publish, on its customer resources pages, is third-party
  chain-of-custody and recycled-content certification for the physical product —
  the compliance regime that actually governs its market. Those are recorded
  here with the exact page that carries each claim.
api_conformance: []
api_conformance_note: >-
  No machine-readable contract exists to assert oauth2, oidc, odata, json:api,
  rfc9457, pagination or idempotency conformance against. The one unauthenticated
  JSON surface on a graphicpkg.com host (the careers job query API) is operated by
  the AppVault career-site platform, uses a bespoke {"error": "..."} envelope
  rather than RFC 9457, and publishes no conformance statement of its own.
