apis:
- aid: graphic-packaging:graphic-packaging-career-site-job-query-api
  name: Graphic Packaging Career Site Job Query API
  description: 'Read-only HTTP JSON API serving Graphic Packaging International''s open job requisitions
    from careers.graphicpkg.com. Four tools — search_jobs, get_job, list_departments and list_locations
    — are selected with a `tool` query parameter and return JSON; 229 open requisitions were returned
    anonymously on 2026-09-12. No authentication is required and CORS is open (access-control-allow-origin
    *). OPERATOR NOTE: this is not a Graphic Packaging product API. The manifest self-identifies as the
    "AppVault Career Site MCP Jobs API", the site is served from Vercel, and the apply links resolve to
    SAP SuccessFactors (career55.sapsf.eu, company=graphicpac) — so the contract belongs to the AppVault
    career-site platform, tenanted under a Graphic Packaging hostname with Graphic Packaging data. Despite
    the /api/mcp/ path it does NOT speak MCP JSON-RPC: POST tools/list returns HTTP 405.'
  humanURL: https://careers.graphicpkg.com/
  baseURL: https://careers.graphicpkg.com/api/mcp/jobs
