aid: graphic-packaging
name: Graphic Packaging
description: Graphic Packaging International is a Fortune 500 global manufacturer of sustainable, paperboard-based
  consumer packaging. Products include folding cartons, multipack cartons, foodservice packaging (cups,
  lids, to-go containers), microwave and ovenable packaging, paperboard canisters, and packaging machinery.
  Markets served include food, beverage, foodservice, household, personal care, healthcare, pharmaceuticals,
  pet care, beauty, and e-commerce. Graphic Packaging publishes no developer program, no API reference
  and no machine-readable contract; its digital surfaces for customers and suppliers (ODS order data,
  ACES, GPI Fiber Furnish Tracker and the Esko WebCenter artwork portal) all sit behind logins. The one
  unauthenticated JSON surface on a graphicpkg.com host is the careers site job query API, which is a
  tenant of the AppVault career-site platform rather than a Graphic Packaging product.
